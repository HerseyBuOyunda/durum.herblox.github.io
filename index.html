<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herblox Status</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            /* Senin yüklediğin doku */
            background-image: url('darkLoadingTexture.png');
            background-repeat: repeat;
            background-size: 150px;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Sayfa içeriği */
        .content {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #107c10;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #107c10;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .status {
            font-size: 1.2rem;
            color: #ccc;
        }

        /* SAĞ ALTTAKİ DÖNEN DAİRE (Videonuzdaki hız) */
        .loader-container {
            position: fixed;
            bottom: 40px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .spinning-circle {
            width: 40px;
            height: 40px;
            background-image: url('DarkThemeLoadingCircle.png');
            background-size: contain;
            background-repeat: no-repeat;
            /* 1.5s -> Videondaki o akıcı hız */
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>HERBLOX STATUS</h1>
        <div class="status">● Sistemler Aktif</div>
        <p style="font-size: 0.8rem; color: #666; margin-top: 20px;">v1.0.2 - Live</p>
    </div>

    <div class="loader-container">
        <span class="loading-text">Veriler senkronize ediliyor...</span>
        <div class="spinning-circle"></div>
    </div>

</body>
</html>
