<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herblox Durumu</title>
    <style>
        :root {
            --xbox-green: #107c10;
            --bg-color: #050505;
            --card-bg: rgba(15, 15, 15, 0.95);
            --text-main: #ffffff;
            --text-dim: #999;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            color: var(--text-main);
            background-color: var(--bg-color);
            /* Senin darkLoadingTexture görselini arka plana döşüyoruz */
            background-image: url('darkLoadingTexture.png');
            background-repeat: repeat;
            background-size: 180px;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Arka planın üzerine hafif bir karanlık katman */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin-top: 60px;
            padding-bottom: 100px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .status-hero {
            background: var(--card-bg);
            border: 1px solid rgba(16, 124, 16, 0.5);
            border-top: 4px solid var(--xbox-green);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            backdrop-filter: blur(8px);
        }

        .status-text {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--xbox-green);
            text-shadow: 0 0 10px rgba(16, 124, 16, 0.4);
        }

        /* Geçmiş Kayıtlar */
        .incident-item {
            background: var(--card-bg);
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #333;
            transition: transform 0.2s;
        }

        .incident-item:hover {
            transform: translateX(5px);
            border-left-color: var(--xbox-green);
        }
