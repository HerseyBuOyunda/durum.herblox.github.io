<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herblox Durumu</title>
    <style>
        :root {
            --xbox-green: #107c10;
            --bg-dark: #050505;
            --card-bg: rgba(20, 20, 20, 0.85);
            --text-gray: #b3b3b3;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background-image: url('darkLoadingTexture.png');
            background-repeat: repeat;
            background-size: 160px;
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin-top: 50px;
            margin-bottom: 120px;
            z-index: 10;
        }

        .header h1 { letter-spacing: 3px; text-align: center; }

        .status-hero {
            background: var(--card-bg);
            border-left: 5px solid var(--xbox-green);
            padding: 25px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* SON 30 GÜN BÖLÜMÜ */
        .history-title {
            font-size: 1.1rem;
            color: var(--text-gray);
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .history-item {
            background: rgba(30, 30, 30, 0.6);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .history-date { color: var(--xbox-green); font-size: 0.8rem; font-weight: bold; }

        /* SAĞ ALTTAKİ DÖNEN DAİRE - KESİN GÖRÜNÜR KATMAN */
        .loader-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #333;
            z-index: 9999; /* En üst katmana aldık */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .spinning-circle {
            width: 35px;
            height: 35px;
            background-image: url('DarkThemeLoadingCircle.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            /* 1.5s -> Senin videondaki hız */
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pulse {
            width: 10px; height: 10px;
            background-color: var(--xbox-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--xbox-green);
            display: inline-block;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>HERBLOX <span style="color:var(--xbox-green)">STATUS</span></h1>
        </div>

        <div class="status-hero">
            <div style="color:var(--xbox-green); font-weight:bold; font-size:1.3rem;">
                <span class="pulse"></span> TÜM SİSTEMLER OPERASYONEL
            </div>
            <p style="color:var(--text-gray); margin-top:10px;">Şu anda kesinti yaşanmıyor.</p>
        </div>

        <div class="history-title">Son 30 Günlük Geçmiş</div>
        
        <div class="history-item">
            <div class="history-date">13 MAYIS 2026</div>
            <div class="history-desc">Asset senkronizasyonu ve dönme hızı (1.5s) optimize edildi.</div>
        </div>
        <div class="history-item">
            <div class="history-date">10 MAYIS 2026</div>
            <div class="history-desc">Herblox API v1.2 performans güncellemesi yayınlandı.</div>
        </div>
    </div>

    <div class="loader-bar">
        <span style="font-size: 0.8rem; color: #aaa;">Canlı İzleniyor</span>
        <div class="spinning-circle"></div>
    </div>

</body>
</html>
